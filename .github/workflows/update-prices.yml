name: Update prices

on:
  schedule:
    - cron: "17 */6 * * *"   # 6시간마다
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch current league and prices
        run: |
          set -euo pipefail
          leagues=$(curl -sf "https://league-fetcher.poe-re.workers.dev/leagues?game=poe1")
          league=$(echo "$leagues" | python3 -c '
          import json,sys
          ls=[l["id"] for l in json.load(sys.stdin)["result"]]
          picks=[l for l in ls if l not in ("Standard","Hardcore") and not l.startswith("Hardcore")]
          print(picks[0] if picks else "Standard")')
          echo "league=$league"
          enc=${league// /%20}

          # beast (lines: name/chaosValue/listingCount)
          curl -sf "https://economy.poe.re/beast/eco_${enc}_Beast.json" -o /tmp/eco_Beast.json
          # scarab/tattoo/runegraft (items+lines: id/primaryValue)
          for cat in scarab tattoo runegraft; do
            Cat=$(python3 -c "print('$cat'.capitalize())")
            curl -sf "https://economy.poe.re/${cat}/eco_${enc}_${Cat}.json" -o /tmp/eco_${Cat}.json
          done

          python3 - "$league" <<'PY'
          import json,sys
          league=sys.argv[1]
          eco=json.load(open('/tmp/eco_Beast.json'))
          slim={"lines":[{"name":l["name"],"chaosValue":l["chaosValue"],"listingCount":l["listingCount"]} for l in eco["lines"]]}
          json.dump(slim,open('data/prices_Beast.json','w',encoding='utf-8'),ensure_ascii=False)
          for cat in ("Scarab","Tattoo","Runegraft"):
              d=json.load(open(f'/tmp/eco_{cat}.json'))
              slim={"items":[{"id":i["id"],"name":i["name"]} for i in d["items"]],
                    "lines":[{"id":l["id"],"primaryValue":l.get("primaryValue",0)} for l in d["lines"]]}
              json.dump(slim,open(f'data/prices_{cat}.json','w',encoding='utf-8'),ensure_ascii=False)
          json.dump({"league":league},open('data/league.json','w'))
          PY
          # expedition uniques (slim to gamble-relevant fields)
          for t in Accessory Armour Jewel Weapon; do
            curl -sf "https://economy.poe.re/expedition/eco_${enc}_Unique${t}.json" -o /tmp/eco_U${t}.json
          done
          python3 - <<'PY'
          import json
          out=[]
          for t in ("Accessory","Armour","Jewel","Weapon"):
              d=json.load(open(f'/tmp/eco_U{t}.json'))
              for l in d["lines"]:
                  out.append({"name":l["name"],"baseType":l.get("baseType",""),"chaosValue":l.get("chaosValue",0)})
          json.dump({"lines":out},open('data/prices_Uniques.json','w',encoding='utf-8'),ensure_ascii=False)
          PY
          curl -sf "https://economy.poe.re/generated.txt" -o data/updated.txt

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "chore: update prices"
          git push
